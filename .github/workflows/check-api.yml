name: Check public API

on: [workflow_call]

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # bsb-native (a bsb-core dependency) is a Rust extension; uv builds it
    # when syncing the workspace, so the toolchain must be present.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install apt dependencies
      run: |
        sudo apt update
        # Install `libopenmpi` for MPI
        sudo apt install openmpi-bin libopenmpi-dev

    # Sets NX_BASE/NX_HEAD env vars for the rest of the job. For pull_request
    # events it resolves NX_BASE to merge-base(origin/<PR base ref>, HEAD) -
    # only used below when github.event_name == 'pull_request'.
    - name: Derive base/head SHAs for nx affected
      if: github.event_name == 'pull_request'
      uses: nrwl/nx-set-shas@v5

    - name: Check public APIs
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          # The commit that just landed on main is the change to check.
          # Manually set the NX BASE and HEAD variables.
          # see https://github.com/dbbs-lab/bsb/issues/152
          ./nx affected -t check-api --base=origin/main~1 --head=HEAD
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          # NX_BASE/NX_HEAD were derived by nrwl/nx-set-shas above.
          echo "Using nx-set-shas base sha $NX_BASE as nx affected base"
          ./nx affected -t check-api --base="$NX_BASE" --head="$NX_HEAD"
        fi
