name: Release

on:
  push:
    branches:
      - main
  # Manual escape hatch, so a release can always be driven by hand when a push
  # trigger is missed or deliberately skipped.
  workflow_dispatch:

env:
  NX_DAEMON: false  # may prevent GHA to stall for some reason

jobs:
  # The release flow pushes its own `chore(release):` commit back to main. That push
  # re-triggers this workflow, so every job is gated on the head commit not being one.
  # `head_commit` is null on a workflow_dispatch run, so a manual run is never gated.
  check-api:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/check-api.yml
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  docs:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/docs.yml
  ruff:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ruff.yml

  release:
    needs: [ruff, build, docs, check-api]
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Create Github token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DBBS_APP_ID }}
          private-key: ${{ secrets.DBBS_APP_PRIVATE_KEY }}

      - name: Set token to env
        run: echo "GITHUB_TOKEN=${{ steps.app-token.outputs.token }}" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install apt dependencies
        run: |
          sudo apt update
          # Install `libopenmpi` for MPI
          sudo apt install openmpi-bin libopenmpi-dev

      - name: Install nodejs
        uses: actions/setup-node@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Nx Release flow
        run: |
          git config --global user.email "neurocomp_dbbs@unipv.it"
          git config --global user.name "DBBS Laboratory"
          # get latest bsb version
          old_version=$(git describe --tags --abbrev=0)
          ./nx release version --verbose
          version=$(uv run --project packages/bsb/pyproject.toml python devtools/update_codemeta.py)
          git add codemeta.json
          ./nx release changelog $version --verbose
          # if the bsb version changes, publish it on pypi
          if [ $version != ${old_version:1} ]; then 
            ./nx release publish --verbose; 
          fi;
